[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-box-minions"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "litellm>=1.40.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
minion = "minions.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["minions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration/fixture_repo"]
