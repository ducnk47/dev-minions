partner: example_client
llm_provider: claude
model: claude-sonnet-4-6
api_key_env: ANTHROPIC_API_KEY
devbox:
  prefer_devcontainer: true
  language_fallback: python
commands:
  lint: "ruff check . --fix"
  test: "pytest"
  install: "pip install -e ."
blueprint: standard
tools:
  - bash
rule_files:
  global: ".cursorrules"
  scoped: true
pr:
  base_branch: main
  risk_classification: true
  labels:
    robot: "minion:robot"
    1-brain: "minion:1-brain"
    2-brain: "minion:2-brain"
    3-brain: "minion:3-brain"
